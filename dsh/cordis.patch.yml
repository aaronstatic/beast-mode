# Beast Mode - dsh bundle patch
# Mounts the Beast Mode bundle entry. The entry mounts two child plugins:
# the skill provider, which registers /install-beast-mode and
# /upgrade-beast-mode as bundled skills, and the web panel host, which
# registers the /beast/api/ and /beast/ui/ webServer routes and registers
# nothing in a profile that holds no webServer.
#
# The file holds ONE insert row on purpose. The root package.json declares a
# dsh.client bundle, and the dsh client module registry allows one active
# loader row per package. A second row of the same package makes the dsh boot
# fail with "resolves from multiple active Loader sources".
- insert:
    - id: beast-mode
      name: ./lib/index.js
